# Deploy only the Python API here; the Next.js frontend stays on v0/Vercel.
services:
  - type: web
    name: bhusanket-evidence-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-lock.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PYTHONUNBUFFERED
        value: "1"
